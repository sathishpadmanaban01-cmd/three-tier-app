name: worker-ci

on:
  push:
    paths:
      - 'app/worker/**'
      - '.github/workflows/worker-ci.yml'

permissions:
  id-token: write
  contents: write

concurrency:
  group: gitops-main
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: three-tier-worker

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r app/worker/requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build and push image
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY=$ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com

          docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG app/worker
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Update worker GitOps values
        run: |
          sed -i "s|^\([[:space:]]*tag:[[:space:]]*\).*|\1${IMAGE_TAG}|" gitops/apps/worker/values.yaml

      - name: Commit and push GitOps change
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add gitops/apps/worker/values.yaml
          git commit -m "Update worker image tag to ${IMAGE_TAG}" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main