apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: three-tier-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sathishpadmanaban01-cmd/three-tier-app.git
    targetRevision: HEAD
    path: gitops/apps/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
