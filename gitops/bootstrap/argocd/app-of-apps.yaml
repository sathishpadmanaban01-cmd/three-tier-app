apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: three-tier-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/three-tier-starter.git
    targetRevision: HEAD
    path: gitops/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
